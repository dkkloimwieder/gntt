name: Publish on NPM
on:
    push:
        branches: [release]

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            # Read the pnpm version from package.json so CI and local agree.
            - uses: pnpm/action-setup@v6.1.1
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install
            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm prettier-check
            - run: pnpm test
            - run: pnpm build
            - uses: JS-DevTools/npm-publish@v4.1.5
              with:
                  token: ${{ secrets.NPM_TOKEN }}
