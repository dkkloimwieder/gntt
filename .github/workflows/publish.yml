name: Publish on NPM
on:
    push:
        branches: [release]

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # No `version:` pin — pnpm/action-setup@v4 reads `packageManager`
            # from package.json (pnpm@10.23.0), so CI and local agree.
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install
            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm prettier-check
            - run: pnpm test
            - run: pnpm build
            - uses: JS-DevTools/npm-publish@v1
              with:
                  token: ${{ secrets.NPM_TOKEN }}
